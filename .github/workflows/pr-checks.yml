# ABOUTME: Runs safe PR validation checks for Rust formatting, tests, and integration coverage.
# ABOUTME: Avoids exposing repository credentials to code from pull request branches.
name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  cargo-fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  cargo-test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: "true"
      - run: cargo clippy --workspace
      - run: cargo test --workspace

  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./Dockerfile
          tags: pkgly:test
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: |
            PKGLY_COMMIT_ID=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=pkgly
          cache-to: type=gha,scope=pkgly,mode=max
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: ./tests/docker
          file: ./tests/docker/Dockerfile.test-runner
          tags: pkgly-test-runner:ci
          load: true
          cache-from: type=gha,scope=test-runner
          cache-to: type=gha,scope=test-runner,mode=max
      - run: ./tests/run_integration_tests.sh
        env:
          PKGLY_INTEGRATION_COMPOSE_OVERRIDE: ${{ github.workspace }}/tests/docker/docker-compose.ci-cache.yml
      - name: Log in for fork preview publication
        if: github.repository == 'Matty666/pkgly' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/generic-oidc'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested fork preview
        if: github.repository == 'Matty666/pkgly' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/generic-oidc'
        run: bash scripts/publish-preview-image.sh
        env:
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PKGLY_IMAGE_REVISION: ${{ github.event.pull_request.head.sha }}

  chart-changes:
    name: detect chart changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: |
          set +e
          git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- charts/
          status=$?
          set -e

          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  helm-lint:
    name: helm lint and unit
    needs: chart-changes
    if: needs.chart-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: ./charts/pkgly/tests/unit.sh

  frontend:
    name: frontend tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python3 tests/workflow/test_preview_image.py -q
      - run: npm --prefix site ci
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix docs ci
      - run: npm --prefix docs run docs:build
